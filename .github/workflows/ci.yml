name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-media.txt
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:production
      - run: python -m unittest discover -s tests/python -v
      - run: npm run smoke:majed
      - name: Cross-platform doctor
        run: node scripts/doctor.mjs --json

  package:
    name: Reproducible packages
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-media.txt
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run release:build
      - uses: actions/upload-artifact@v4
        with:
          name: portable-packages
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
