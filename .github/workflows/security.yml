name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Release allow-list and secret scan
        run: python -c "import sys; sys.path.insert(0, 'scripts'); import release; release.collect()"
      - name: Git object size guard
        run: git count-objects -vH
